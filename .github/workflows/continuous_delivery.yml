name: Docker Build

on:
  push:
    branches: [ continuous_delivery ]
  pull_request:
    branches: [ continuous_delivery ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ENV_GREETING: ${{ secrets.ENV_GREETING }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # needed for checkout
      packages: write         # needed to push to GHCR

    steps:
    - name: Check Out Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1  2026-07-17

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0   Jul 29th 2026
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Images
      working-directory: ./src
      run: |
        docker buildx bake -f compose.prod.yaml --push
